# Render deployment config — see DEPLOYMENT.md for the honest RAM discussion
# before picking a plan. Render's free tier (512MB) will very likely OOM
# with torch+chromadb+sentence-transformers loaded — use at least the
# Starter plan (512MB→2GB depending on tier) or set ENABLE_CNN_FIGURES=false
# to reduce the footprint.

services:
  - type: web
    name: paperlens-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter  # NOT free — see DEPLOYMENT.md for why
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paperlens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_CNN_FIGURES
        value: "true"
      - key: AGENTIC_RAG_ENABLED
        value: "true"
      - key: FRONTEND_URL
        sync: false  # set manually to your deployed frontend URL
      - key: RATE_LIMIT_DEFAULT
        value: "60/minute"
    healthCheckPath: /ping

  - type: web
    name: paperlens-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false  # set to your backend service URL after first deploy

databases:
  - name: paperlens-db
    plan: free
    databaseName: paperlens
    user: paperlens
